{% extends "layout.html" %}
{% block title %}Sign in · Kitting Portal{% endblock %}
{% block content %}
<form method="post" class="auth-card">
    <h1>Kitting Portal</h1>
    {% if error %}<div class="flash flash-error">{{ error }}</div>{% endif %}
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <label>Username <input name="username" class="field" autofocus autocomplete="username" required></label>
    <label>Password <input name="password" type="password" class="field" autocomplete="current-password" required></label>
    <button class="btn btn-primary" type="submit">Sign in</button>
</form>
{% endblock %}
